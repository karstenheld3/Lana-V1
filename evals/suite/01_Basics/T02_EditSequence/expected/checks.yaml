checks:
  - id: file_created_via_edit_tool
    action: "Agent created notes.md via write_to_file"
    severity: CRITICAL
    assert: {type: tool_called, tool: write_to_file, min: 1, args_regex: "notes\\.md"}
  - id: read_before_edit
    action: "No edit on a file the agent never read or created"
    severity: CRITICAL
    assert: {type: read_before_edit}
