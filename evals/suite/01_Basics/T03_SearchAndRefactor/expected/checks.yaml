checks:
  - id: search_performed
    action: "Agent searched for calc_total usages before editing"
    severity: HIGH
    assert: {type: tool_called, tool: grep_search, min: 1, args_regex: "calc_total"}
  - id: edits_performed
    action: "Agent edited files via edit tools"
    severity: CRITICAL
    assert: {type: tool_called, tool: edit, min: 1}
  - id: read_before_edit
    action: "No edit on a file the agent never read or created"
    severity: CRITICAL
    assert: {type: read_before_edit}
