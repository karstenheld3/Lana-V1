checks:
  - id: spec_read_before_critique
    action: "Agent read the spec before critiquing"
    severity: CRITICAL
    assert: {type: tool_called, tool: read_file, min: 1, args_regex: "_SPEC_GREETER"}
  - id: review_written
    action: "Agent wrote the review file"
    severity: CRITICAL
    assert: {type: tool_called, tool: write_to_file, min: 1, args_regex: "_REVIEW_GREETER"}
  - id: spec_fixed_via_edit
    action: "Agent edited the spec during the implement step"
    severity: CRITICAL
    assert: {type: tool_called, tool: edit, min: 1, args_regex: "_SPEC_GREETER"}
  - id: read_before_edit
    action: "No edit on a file the agent never read or created"
    severity: CRITICAL
    assert: {type: read_before_edit}
