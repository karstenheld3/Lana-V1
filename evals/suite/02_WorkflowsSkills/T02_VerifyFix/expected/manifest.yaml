required_files:
  - "STATUS.md"
  - "FIXLOG.md"
file_rules:
  - glob: "STATUS.md"
    patterns:
      - {name: iso_date, regex: "2026-03-15"}
      - {name: backend_kept, regex: "Backend"}
      - {name: frontend_kept, regex: "Frontend"}
      - {name: next_step_kept, regex: "end of the quarter"}
    forbid_content: ["✅", "❌", "|--", "03/15/2026", "---"]
  - glob: "FIXLOG.md"
    patterns:
      - {name: list_items, regex: "^- "}
