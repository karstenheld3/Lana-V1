checks:
  - id: status_read_first
    action: "Agent read STATUS.md before fixing it"
    severity: CRITICAL
    assert: {type: tool_called, tool: read_file, min: 1, args_regex: "STATUS\\.md"}
  - id: fixes_via_edit_tools
    action: "Agent fixed STATUS.md via edit tools"
    severity: CRITICAL
    assert: {type: tool_called, tool: edit, min: 1, args_regex: "STATUS\\.md"}
  - id: read_before_edit
    action: "No edit on a file the agent never read or created"
    severity: CRITICAL
    assert: {type: read_before_edit}
  - id: fixlog_written
    action: "Agent wrote FIXLOG.md"
    severity: HIGH
    assert: {type: tool_called, tool: write_to_file, min: 1, args_regex: "FIXLOG\\.md"}
