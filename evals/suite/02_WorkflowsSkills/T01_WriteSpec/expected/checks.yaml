checks:
  - id: spec_template_read
    action: "Agent read SPEC_TEMPLATE.md from the write-documents skill before writing"
    severity: HIGH
    assert: {type: tool_called, tool: read_file, min: 1, args_regex: "SPEC_TEMPLATE"}
  - id: spec_written_via_edit_tool
    action: "Agent wrote the spec via write_to_file"
    severity: CRITICAL
    assert: {type: tool_called, tool: write_to_file, min: 1, args_regex: "_SPEC_WORDCOUNT"}
  - id: read_before_edit
    action: "No edit on a file the agent never read or created"
    severity: CRITICAL
    assert: {type: read_before_edit}
