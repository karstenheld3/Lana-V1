checks:
  - id: web_searches_executed
    action: "Agent executed at least 3 web searches"
    severity: CRITICAL
    assert: {type: tool_called, tool: search_web, min: 3}
  - id: sources_fetched
    action: "Agent fetched at least 2 source pages"
    severity: HIGH
    assert: {type: tool_called, tool: read_url_content, min: 2}
  - id: info_written_via_edit_tool
    action: "Agent wrote the INFO document"
    severity: CRITICAL
    assert: {type: tool_called, tool: write_to_file, min: 1, args_regex: "_INFO_BERLINWALL"}
